services:
  postgres:
    image: postgres:16-alpine
    container_name: closiq-postgres
    environment:
      POSTGRES_DB: closiq
      POSTGRES_USER: closiq
      POSTGRES_PASSWORD: closiq
    ports:
      - "5433:5432"
    volumes:
      - closiq_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U closiq -d closiq"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: closiq-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: closiq-backend
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: test
      SERVER_PORT: 8081
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: closiq
      DB_USER: closiq
      DB_PASSWORD: closiq
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: dev-secret-key-for-jwt-signing-minimum-256-bits-required-here
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8081/api/v1
        NEXT_PUBLIC_USE_MOCK: "false"
    container_name: closiq-frontend
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  closiq_pg_data:
