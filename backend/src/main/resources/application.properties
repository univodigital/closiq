spring.application.name=closiq-backend
spring.profiles.active=dev

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.format_sql=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

server.servlet.context-path=/

management.endpoints.web.exposure.include=health,info

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha

closiq.jwt.secret=${JWT_SECRET:change-me-in-production-use-at-least-256-bits-secret-key-here}
closiq.jwt.access-token-expiration-minutes=15
closiq.jwt.refresh-token-expiration-days=30

closiq.otp.length=6
closiq.otp.expiry-seconds=300
closiq.otp.resend-cooldown-seconds=60
closiq.otp.max-resends-per-session=3
closiq.otp.max-verify-attempts=5
closiq.otp.lockout-minutes=15
closiq.otp.console-log-enabled=true

closiq.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}

closiq.inventory.low-stock-threshold=2
closiq.inventory.default-availability-days=90

closiq.booking.hold-ttl-minutes=15
closiq.booking.rental-lead-days=2
closiq.booking.delivery-fee-default=0
closiq.booking.hold-expiry-poll-ms=60000
closiq.booking.seller-accept-sla-hours=24
closiq.booking.commission-rate-bps=1500
closiq.booking.cancellation.refund-business-days=5
closiq.booking.cancellation.deposit-refund-days-min=5
closiq.booking.cancellation.deposit-refund-days-max=7
closiq.booking.cancellation.after-dispatch-rental-refund-percent=70
closiq.booking.cancellation.deposit-fully-refundable-on-cancel=true

closiq.razorpay.key-id=${RAZORPAY_KEY_ID:rzp_test_stub}
closiq.razorpay.key-secret=${RAZORPAY_KEY_SECRET:razorpay_stub_secret}
closiq.razorpay.stub-enabled=${RAZORPAY_STUB_ENABLED:true}

closiq.shadowfax.webhook-secret=${SHADOWFAX_WEBHOOK_SECRET:shadowfax_stub_webhook_secret}
closiq.shadowfax.stub-enabled=${SHADOWFAX_STUB_ENABLED:true}

closiq.s3.bucket=closiq-media
closiq.s3.region=ap-south-1
closiq.s3.cdn-base-url=https://cdn.closiq.com
closiq.s3.stub-enabled=true

closiq.storage.provider=${STORAGE_PROVIDER:cloudinary}

closiq.cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:${CLOSIQ_CLOUDINARY_CLOUD_NAME:}}
closiq.cloudinary.api-key=${CLOUDINARY_API_KEY:${CLOSIQ_CLOUDINARY_API_KEY:}}
closiq.cloudinary.api-secret=${CLOUDINARY_API_SECRET:${CLOSIQ_CLOUDINARY_API_SECRET:}}
closiq.cloudinary.folder=${CLOUDINARY_FOLDER:${CLOSIQ_CLOUDINARY_FOLDER:closiq}}
closiq.cloudinary.stub-enabled=${CLOUDINARY_STUB_ENABLED:${CLOSIQ_CLOUDINARY_STUB_ENABLED:true}}

# Email (set closiq.mail.enabled=true and configure brevo.* to send via Brevo HTTP API)
closiq.mail.enabled=${MAIL_ENABLED:false}
closiq.mail.from=${MAIL_FROM:noreply@closiq.com}
closiq.mail.from-name=${MAIL_FROM_NAME:Closiq}
brevo.api-key=${BREVO_API_KEY}
brevo.sender-email=${BREVO_SENDER_EMAIL}
brevo.sender-name=${BREVO_SENDER_NAME:Closiq}

# Notification channels (SMS/push disabled until providers are configured)
closiq.notification.sms-enabled=false
closiq.notification.push-enabled=false
closiq.notification.return-reminder-hours-before-end=24
closiq.notification.return-reminder-poll-ms=3600000
closiq.notification.app-base-url=${APP_BASE_URL:http://localhost:3000}
